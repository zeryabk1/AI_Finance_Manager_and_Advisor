{% extends 'base.html' %}
{% block title %}Reset Email Sent{% endblock %}
{% block auth_content %}
<div class="d-flex align-items-center justify-content-center auth-wrapper">
    <div class="card glass-card p-4 text-center" style="width: 420px;">
        <h4 class="mb-3">Check your email</h4>
        <p>If an account exists with that email, we've sent a link to reset your password.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-2">Back to Login</a>
    </div>
</div>
{% endblock %}
