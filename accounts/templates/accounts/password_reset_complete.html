{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block auth_content %}
<div class="d-flex align-items-center justify-content-center auth-wrapper">
    <div class="card glass-card p-4 text-center" style="width: 420px;">
        <h4 class="mb-3">Password reset complete</h4>
        <p>Your password has been changed successfully.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-2">Log In</a>
    </div>
</div>
{% endblock %}
