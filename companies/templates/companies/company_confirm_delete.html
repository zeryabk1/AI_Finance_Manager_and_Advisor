{% extends 'base.html' %}
{% block title %}Delete Company{% endblock %}
{% block content %}
<h3 class="mb-4">Delete Company</h3>
<div class="card p-4" style="max-width:500px;">
    <p>Are you sure you want to delete <strong>{{ company.name }}</strong>? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'companies:list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
