{% extends 'base.html' %}
{% block title %}Delete Asset{% endblock %}
{% block content %}
<h3 class="mb-4">Delete Asset</h3>
<div class="card p-4" style="max-width:500px;">
    <p>Delete <strong>{{ asset.asset_name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'assets:asset_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
